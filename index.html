<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestro álbum</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 40%,#3b2a2e,#171012);color:#eee;font:15px Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}

/* LIBRO (dos páginas) */
.book{--w:min(94vw,920px,calc((100vh - 130px)/.68));width:var(--w);height:calc(var(--w)*.68);font-size:calc(var(--w)/48);perspective:2400px;position:relative}
.wrap{position:absolute;inset:0;transition:transform .8s ease}
.leaf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.5,.1,.3,1)}
.leaf.flip{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front{border-radius:0 .6em .6em 0}
.back{transform:rotateY(180deg);border-radius:.6em 0 0 .6em}

/* PÁGINA */
.pg{background:#1d1c20;height:100%;padding:1.25em 1.5em;display:flex;flex-direction:column;gap:.6em;position:relative;overflow:hidden}
.front .pg{box-shadow:inset 1.6em 0 1.6em -1em #000a}
.back .pg{box-shadow:inset -1.6em 0 1.6em -1em #000a}
.page-title{font:1em Caveat,cursive;color:#e0bd78;text-align:center;opacity:.65;min-height:1.1em}
.photos{flex:1;min-height:0;display:flex;flex-direction:column;gap:.7em}
.n{position:absolute;bottom:.4em;left:0;right:0;text-align:center;font:1.1em Caveat,cursive;opacity:.4}

/* ESPACIO DE FOTO
   .pw = zona disponible. .fit = contenedor medible.
   .ph = marco: siempre del tamaño del espacio, con o sin foto. */
.slot{flex:1;min-height:0;display:flex;flex-direction:column}
.pw{flex:1;min-height:0;position:relative}
.fit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ph{position:relative;width:100%;height:100%;background:#2c2b31;display:flex;align-items:center;justify-content:center;text-align:center;color:#8d8a99;cursor:pointer;overflow:hidden;font-size:.95em;border-radius:.15em;transition:background .2s ease}
.ph:hover{background:#35343b}
.ph.has{background:#171519}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* esquineros sobre el marco */
.ph::after{content:"";position:absolute;inset:0;pointer-events:none;--c:#f3eee3;filter:drop-shadow(0 0 .12em #000b);background:linear-gradient(135deg,var(--c) 50%,#0000 50%) 0 0/1.5em 1.5em no-repeat,linear-gradient(225deg,var(--c) 50%,#0000 50%) 100% 0/1.5em 1.5em no-repeat,linear-gradient(45deg,var(--c) 50%,#0000 50%) 0 100%/1.5em 1.5em no-repeat,linear-gradient(315deg,var(--c) 50%,#0000 50%) 100% 100%/1.5em 1.5em no-repeat}
.ph.uploading{cursor:wait}
.ph.uploading::before{content:"Subiendo…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;color:#e8d3a1;z-index:5}

/* TEXTO */
.cap{font:1.35em/1.2 Caveat,cursive;text-align:center;color:#f3eee3;padding:.25em 0 0;min-height:1.3em;outline:none}
.cap:empty:before{content:attr(data-p);opacity:.35}

/* PORTADA */
.cover{height:100%;background:linear-gradient(100deg,#3f121c 0,#6b2230 6%,#5a1c29 100%);border:.5em solid #4a1823;box-shadow:inset 0 0 0 .2em #d9b36c55;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2em;gap:.6em}
.cover h1{font:600 3.2em/1.1 Fraunces,Georgia,serif;color:#e0bd78;margin:0;outline:none;text-shadow:0 1px 0 #0006}
.cover .s{font:1.8em Caveat,cursive;color:#e0bd78cc;outline:none}
.cover i{display:block;width:5em;height:.15em;background:#e0bd78;opacity:.7}
[contenteditable]:focus{box-shadow:0 1px 0 #e0bd7899}

/* BOTONES Y MENSAJES */
.bar{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
button{font:inherit;border:1px solid #e0bd7866;background:#2a1a1e;color:#e8d3a1;border-radius:999px;padding:8px 18px;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,.ph:focus-visible{outline:3px solid #e0bd78;outline-offset:2px}
.hint{font-size:.8em;opacity:.55;margin-top:8px;text-align:center;padding:0 10px}
.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#24171b;border:1px solid #e0bd7855;color:#e8d3a1;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:9999;white-space:nowrap}
.status.show{opacity:1}
.status.error{border-color:#a85c67;color:#f0b8c0}

/* CELULAR: una página a la vez (la clase "single" la pone el script) */
.single .book{--pw:min(94vw,calc((100dvh - 150px)/1.36));width:var(--pw);height:calc(var(--pw)*1.36);font-size:calc(var(--pw)/24);perspective:1600px}
.single .leaf{position:static;width:auto;height:auto;transform:none!important;transform-style:flat;transition:none}
.single .face,.single .back{position:absolute;inset:0;transform:none;backface-visibility:visible;-webkit-backface-visibility:visible;border-radius:.6em;opacity:0;visibility:hidden;transition:transform .55s cubic-bezier(.5,.1,.3,1),opacity .45s ease,visibility 0s .55s}
.single .face.past{transform:translateX(-35%) rotateY(-28deg)}
.single .face.fut{transform:translateX(35%) rotateY(28deg)}
.single .face.cur{opacity:1;visibility:visible;transition-delay:0s}
.single .pg{box-shadow:none}
.single .bar{margin-top:12px;gap:7px}
.single button{padding:7px 13px;font-size:14px}
.single .hint{font-size:11px;max-width:95vw}
.status{max-width:92vw}
@media (prefers-reduced-motion:reduce){.leaf,.wrap,.face{transition:none!important}}
</style>
</head>
<body>

<div class="book"><div class="wrap" id="wrap"></div></div>

<div class="bar">
  <button id="prev">Anterior</button>
  <button id="next">Siguiente</button>
  <button id="add">Agregar hoja</button>
</div>

<div class="hint">Toca un recuadro para poner foto. Toca las letras para escribir. Desliza o usa las flechas para pasar hojas.</div>
<div id="status" class="status"></div>
<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/*" hidden>

<script>
/* CONFIGURACIÓN */
const API_BASE = 'https://nuestro-album-api.onrender.com';
const ALBUM_KEY = 'ChrisYess2026Fotos';

/* ELEMENTOS Y ESTADO */
const $ = id => document.getElementById(id);
const wrap = $('wrap'), file = $('file'), statusBox = $('status');
const prev = $('prev'), next = $('next'), add = $('add');
const leaves = [];
let p = 0, k = 0, target = null, nextSlotNumber = 1, statusTimer = null;
const mq = matchMedia('(max-width:700px)');
let single = mq.matches;

/* MENSAJES */
function showStatus(message, error = false){
  clearTimeout(statusTimer);
  statusBox.textContent = message;
  statusBox.classList.toggle('error', error);
  statusBox.classList.add('show');
  statusTimer = setTimeout(() => statusBox.classList.remove('show'), 3000);
}

/* ESPACIO PARA UNA FOTO */
const slot = id => `
  <div class="slot">
    <div class="pw"><div class="fit">
      <div class="ph empty" tabindex="0" data-slot="${id}" aria-label="Agregar foto">＋ Foto</div>
    </div></div>
    <div class="cap" contenteditable spellcheck="false" data-p="Escribe un recuerdo" data-for="${id}"></div>
  </div>`;

/* PÁGINA
   Impares (1, 3, 5...) = 2 fotos una debajo de la otra
   Pares   (2, 4, 6...) = 1 foto grande */
function page(n){
  const count = n % 2 === 1 ? 2 : 1;
  const title = count === 2 ? 'Momentos juntos ❤️' : 'Un momento especial ❤️';
  let slots = '';
  for(let i = 0; i < count; i++) slots += slot(`foto-${nextSlotNumber++}`);
  return `
    <div class="pg">
      <div class="page-title">${title}</div>
      <div class="photos">${slots}</div>
      <span class="n">${n}</span>
    </div>`;
}

/* PORTADA */
const cover = `
  <div class="cover">
    <i></i>
    <h1 contenteditable spellcheck="false" data-for="titulo">Nuestro álbum</h1>
    <div class="s" contenteditable spellcheck="false" data-for="dedicatoria">Para ti, con todo mi cariño</div>
    <i></i>
  </div>`;

/* HOJA: frente + dorso.
   Orden de lectura: portada, dorso de la portada (1), frente hoja 1 (2), dorso hoja 1 (3)... */
function addLeaf(){
  const i = leaves.length;
  const l = document.createElement('div');
  l.className = 'leaf';
  l.innerHTML = `
    <div class="face front">${i ? page(2 * i) : cover}</div>
    <div class="face back">${page(2 * i + 1)}</div>`;

  l.querySelectorAll('.ph').forEach(ph => {
    const open = () => { target = ph; file.value = ''; file.click(); };
    ph.addEventListener('click', open);
    ph.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }
    });
  });

  l.querySelectorAll('[data-for]').forEach(bindText);

  wrap.appendChild(l);
  leaves.push(l);
  render(true);
}

/* RENDER */
function render(now){
  const L = leaves.length;
  document.body.classList.toggle('single', single);

  if(single){
    leaves.forEach((l, i) => {
      [l.firstElementChild, l.lastElementChild].forEach((f, j) => {
        const idx = 2 * i + j;
        f.classList.toggle('cur', idx === k);
        f.classList.toggle('past', idx < k);
        f.classList.toggle('fut', idx > k);
      });
    });
    wrap.style.transform = 'none';
    prev.disabled = k === 0;
    next.disabled = k === 2 * L - 1;
    return;
  }

  leaves.forEach((l, i) => {
    l.classList.toggle('flip', i < p);
    const z = i < p ? i : L - i;
    if(now) l.style.zIndex = z;
    else setTimeout(() => { l.style.zIndex = z; }, 400);
  });
  wrap.style.transform = p === 0 ? 'translateX(-25%)' : p === L ? 'translateX(25%)' : 'none';
  prev.disabled = p === 0;
  next.disabled = p === L;
}

/* CAMBIO ENTRE CELULAR Y PANTALLA GRANDE */
mq.addEventListener('change', e => {
  if(e.matches) k = Math.max(0, 2 * p - 1);
  else p = Math.ceil(k / 2);
  single = e.matches;
  render(true);
});

/* NAVEGACIÓN */
function go(d){
  const L = leaves.length;
  if(single){
    const n = Math.max(0, Math.min(2 * L - 1, k + d));
    if(n !== k){ k = n; render(false); }
    return;
  }
  const n = Math.max(0, Math.min(L, p + d));
  if(n !== p){ p = n; render(false); }
}
prev.onclick = () => go(-1);
next.onclick = () => go(1);
add.onclick = () => {
  addLeaf();
  if(single) k = 2 * leaves.length - 2;
  else p = leaves.length - 1;
  render(false);
};

document.addEventListener('keydown', e => {
  if(e.target.isContentEditable) return;
  if(e.key === 'ArrowRight') go(1);
  if(e.key === 'ArrowLeft') go(-1);
});

let x0 = null;
document.addEventListener('pointerdown', e => { x0 = e.clientX; });
document.addEventListener('pointerup', e => {
  if(x0 === null) return;
  const d = e.clientX - x0;
  x0 = null;
  if(Math.abs(d) > 70) go(d < 0 ? 1 : -1);
});

/* TEXTOS (leyendas, título y dedicatoria)
   Se guardan solos 1.5 s después de dejar de escribir, o al tocar fuera. */
const savedTexts = {};
const textTimers = {};

function bindText(el){
  el.dataset.initial = el.textContent.trim();
  el.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); el.blur(); }
  });
  el.addEventListener('input', () => {
    clearTimeout(textTimers[el.dataset.for]);
    textTimers[el.dataset.for] = setTimeout(() => saveText(el, false), 1500);
  });
  el.addEventListener('blur', () => {
    clearTimeout(textTimers[el.dataset.for]);
    saveText(el, true);
  });
}

async function saveText(el, notify){
  const key = el.dataset.for;
  const text = el.textContent.trim();
  const last = key in savedTexts ? savedTexts[key] : el.dataset.initial;
  if(text === last) return;

  try{
    const response = await fetch(`${API_BASE}/api/texto`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'x-album-key': ALBUM_KEY },
      body: JSON.stringify({ clave: key, texto: text })
    });
    const data = await response.json();
    if(!response.ok || !data.success) throw new Error(data.message || 'Error al guardar.');
    savedTexts[key] = text;
    if(notify) showStatus('Texto guardado ❤️');
  }catch(error){
    console.error(error);
    showStatus('No se pudo guardar el texto: ' + error.message, true);
  }
}

/* SUBIR FOTO */
async function uploadPhoto(f, photoSlot){
  if(!f) return;
  if(!photoSlot){ showStatus('No se encontró el espacio de la foto.', true); return; }
  if(!['image/jpeg', 'image/png', 'image/webp'].includes(f.type)){ showStatus('Usa JPG, PNG o WebP.', true); return; }
  if(f.size > 10 * 1024 * 1024){ showStatus('La foto no puede superar los 10 MB.', true); return; }

  photoSlot.classList.add('uploading');
  showStatus('Subiendo foto ❤️');

  try{
    const formData = new FormData();
    formData.append('slot', photoSlot.dataset.slot);
    formData.append('foto', f);

    const response = await fetch(`${API_BASE}/api/upload`, {
      method: 'POST',
      headers: { 'x-album-key': ALBUM_KEY },
      body: formData
    });
    const data = await response.json();

    if(!response.ok || !data.success){
      throw new Error(data.message || data.error || 'No se pudo subir la foto.');
    }

    const foto = data.foto;
    mostrarFoto(photoSlot, foto.url, foto.width, foto.height);
    showStatus('Foto guardada ❤️');
  }catch(error){
    console.error(error);
    showStatus('No se pudo subir la foto: ' + error.message, true);
  }finally{
    photoSlot.classList.remove('uploading');
    file.value = '';
  }
}

/* MOSTRAR FOTO
   La foto llena todo el espacio: todos los marcos quedan del mismo tamaño. */
function mostrarFoto(photoSlot, url, width, height){
  photoSlot.innerHTML = '';
  photoSlot.classList.remove('empty');
  photoSlot.classList.add('has');
  const img = new Image();
  img.alt = 'Foto del álbum ❤️';
  img.decoding = 'async';
  img.src = url;
  photoSlot.appendChild(img);
}

file.onchange = async () => {
  const f = file.files[0];
  if(!f || !target){ file.value = ''; return; }
  await uploadPhoto(f, target);
};

/* CARGAR ÁLBUM
   Primero se crean las hojas necesarias, luego se colocan las fotos. */
async function loadAlbum(){
  try{
    showStatus('Cargando nuestro álbum…');

    const response = await fetch(`${API_BASE}/api/album`);
    if(!response.ok) throw new Error('No se pudo consultar el álbum.');

    const data = await response.json();
    if(!data || !data.fotos) return;
    const textos = data.textos || {};

    const ids = [...Object.keys(data.fotos), ...Object.keys(textos)].map(id => {
      const m = id.match(/^foto-(\d+)$/);
      return m ? Number(m[1]) : 0;
    });
    const maxId = Math.max(0, ...ids);

    while(nextSlotNumber - 1 < maxId) addLeaf();

    Object.entries(data.fotos).forEach(([slotId, foto]) => {
      const ph = document.querySelector(`.ph[data-slot="${slotId}"]`);
      if(ph) mostrarFoto(ph, foto.url, foto.width, foto.height);
    });

    Object.entries(textos).forEach(([key, texto]) => {
      const el = document.querySelector(`[data-for="${key}"]`);
      if(el){ el.textContent = texto; savedTexts[key] = texto; }
    });

    showStatus('Álbum cargado ❤️');
  }catch(error){
    console.error(error);
    showStatus('No se pudo conectar con el álbum.', true);
  }
}

/* INICIO */
for(let i = 0; i < 4; i++) addLeaf();
loadAlbum();
</script>
</body>
</html>
