<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestro álbum</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 40%,#3b2a2e,#171012);color:#eee;font:15px Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}

/* LIBRO */
.book{--w:min(94vw,920px,calc((100vh - 130px)/.68));width:var(--w);height:calc(var(--w)*.68);font-size:calc(var(--w)/48);perspective:2400px;position:relative}
.wrap{position:absolute;inset:0;transition:transform .8s ease}
.leaf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.5,.1,.3,1)}
.leaf.flip{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front{border-radius:0 .6em .6em 0}
.back{transform:rotateY(180deg);border-radius:.6em 0 0 .6em}

/* PÁGINA */
.pg{background:#1d1c20;height:100%;padding:1.25em 1.5em;display:flex;flex-direction:column;gap:.8em;position:relative;overflow:hidden}
.front .pg{box-shadow:inset 1.6em 0 1.6em -1em #000a}
.back .pg{box-shadow:inset -1.6em 0 1.6em -1em #000a}

/* SLOT */
.slot{min-height:0;display:flex;flex-direction:column;position:relative}
.photo-title{font:1em Caveat,cursive;color:#e0bd78;text-align:center;opacity:.65;min-height:1.1em;margin-bottom:.25em}
.pw{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.ph{position:absolute;background:#2c2b31;display:flex;align-items:center;justify-content:center;text-align:center;color:#8d8a99;cursor:pointer;overflow:hidden;font-size:.95em;transition:background .2s ease,transform .2s ease;border-radius:.15em}
.ph:hover{background:#35343b}
.ph:active{transform:scale(.995)}
.ph img{width:100%;height:100%;display:block}

/* HOJA HORIZONTAL: 2 fotos una debajo de la otra */
.horizontal-page,.vertical-page{display:flex;flex-direction:column}
.horizontal-page{gap:.45em}
.vertical-page{gap:.5em}
.horizontal-title,.vertical-title{font:1em Caveat,cursive;color:#e0bd78;text-align:center;opacity:.65;min-height:1.1em}
.horizontal-photos{flex:1;min-height:0;display:flex;flex-direction:column;gap:.6em}
.horizontal-photos .slot{flex:1;min-height:0}
.horizontal-photos .photo-title,.vertical-photo .photo-title{display:none}
.horizontal-photos .pw{flex:1;min-height:0;position:relative}
.horizontal-photos .ph{position:absolute;inset:0;width:100%;height:100%}
.horizontal-photos .ph img{object-fit:cover}

/* HOJA VERTICAL: 1 foto */
.vertical-photo{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.vertical-photo .slot{width:100%;height:100%;min-height:0;display:flex;flex-direction:column}
.vertical-photo .pw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.vertical-photo .ph{position:relative;width:58%;height:100%;min-height:0}
.vertical-photo .ph img{object-fit:contain;background:#171519}
.ph.vertical{background:#171519}
.ph.vertical img{object-fit:contain}
.ph.horizontal img{object-fit:cover}

/* ESQUINEROS */
.cr{position:absolute;inset:0;pointer-events:none;--c:#f3eee3;background:linear-gradient(135deg,var(--c) 50%,#0000 50%) 0 0/1.5em 1.5em no-repeat,linear-gradient(225deg,var(--c) 50%,#0000 50%) 100% 0/1.5em 1.5em no-repeat,linear-gradient(45deg,var(--c) 50%,#0000 50%) 0 100%/1.5em 1.5em no-repeat,linear-gradient(315deg,var(--c) 50%,#0000 50%) 100% 100%/1.5em 1.5em no-repeat}

/* TEXTO */
.cap{font:1.35em/1.2 Caveat,cursive;text-align:center;color:#f3eee3;padding:.2em 0 0;min-height:1.3em;outline:none}
.cap:empty:before{content:attr(data-p);opacity:.35}
.n{position:absolute;bottom:.4em;left:0;right:0;text-align:center;font:1.1em Caveat,cursive;opacity:.4}

/* PORTADA */
.cover{height:100%;background:linear-gradient(100deg,#3f121c 0,#6b2230 6%,#5a1c29 100%);border:.5em solid #4a1823;box-shadow:inset 0 0 0 .2em #d9b36c55;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2em;gap:.6em}
.cover h1{font:600 3.2em/1.1 Fraunces,Georgia,serif;color:#e0bd78;margin:0;outline:none;text-shadow:0 1px 0 #0006}
.cover .s{font:1.8em Caveat,cursive;color:#e0bd78cc;outline:none}
.cover i{display:block;width:5em;height:.15em;background:#e0bd78;opacity:.7}
[contenteditable]:focus{box-shadow:0 1px 0 #e0bd7899}

/* BOTONES */
.bar{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
button{font:inherit;border:1px solid #e0bd7866;background:#2a1a1e;color:#e8d3a1;border-radius:999px;padding:8px 18px;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,.ph:focus-visible{outline:3px solid #e0bd78;outline-offset:2px}
.hint{font-size:.8em;opacity:.55;margin-top:8px;text-align:center;padding:0 10px}

/* SUBIDA Y MENSAJES */
.ph.uploading{cursor:wait;background:#33282d}
.ph.uploading::after{content:"Subiendo…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;color:#e8d3a1;z-index:5}
.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#24171b;border:1px solid #e0bd7855;color:#e8d3a1;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:9999;white-space:nowrap}
.status.show{opacity:1}
.status.error{border-color:#a85c67;color:#f0b8c0}

/* CELULAR */
@media (max-width:600px){
  .book{--w:min(96vw,calc((100vh - 145px)/.68))}
  .bar{margin-top:12px;gap:7px}
  button{padding:7px 13px;font-size:14px}
  .hint{font-size:11px;max-width:95vw}
  .cover h1{font-size:2.6em}
  .cover .s{font-size:1.5em}
  .vertical-photo .ph{width:70%}
  .pg{padding:1em 1.1em;gap:.6em}
  .horizontal-title,.vertical-title{font-size:.9em}
  .cap{font-size:1.15em}
}
@media (prefers-reduced-motion:reduce){.leaf,.wrap{transition:none}}
</style>
</head>
<body>

<div class="book"><div class="wrap" id="wrap"></div></div>

<div class="bar">
  <button id="prev">Anterior</button>
  <button id="next">Siguiente</button>
  <button id="add">Agregar hoja</button>
</div>

<div class="hint">Toca un recuadro para poner foto. Toca las letras para escribir. Desliza o usa las flechas para pasar hojas.</div>
<div id="status" class="status"></div>
<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/*" hidden>

<script>
/* CONFIGURACIÓN */
const API_BASE = 'http://localhost:3000';
const ALBUM_KEY = 'ChrisYess2026Fotos';

/* ELEMENTOS Y ESTADO */
const $ = id => document.getElementById(id);
const wrap = $('wrap'), file = $('file'), statusBox = $('status');
const prev = $('prev'), next = $('next'), add = $('add');
const leaves = [];
let p = 0, target = null, nextSlotNumber = 1, statusTimer = null;

/* MENSAJES */
function showStatus(message, error = false){
  clearTimeout(statusTimer);
  statusBox.textContent = message;
  statusBox.classList.toggle('error', error);
  statusBox.classList.add('show');
  statusTimer = setTimeout(() => statusBox.classList.remove('show'), 3000);
}

/* ESPACIO PARA UNA FOTO */
function slot(slotId, type){
  const h = type === 'horizontal';
  return `
    <div class="slot ${h ? 'horizontal-block' : 'vertical-block'}" data-block="${type}">
      <div class="photo-title">${h ? 'Momentos juntos' : 'Nuestros momentos'}</div>
      <div class="pw">
        <div class="ph empty" tabindex="0" data-slot="${slotId}" data-block="${type}" aria-label="Agregar foto">＋ Foto</div>
        <i class="cr"></i>
      </div>
      <div class="cap" contenteditable spellcheck="false" data-p="Escribe un recuerdo"></div>
    </div>`;
}

/* PÁGINA
   Impares (1, 3, 5...) = 2 fotos horizontales
   Pares   (2, 4, 6...) = 1 foto vertical */
function page(n){
  if(n % 2 === 1){
    const a = `foto-${nextSlotNumber++}`;
    const b = `foto-${nextSlotNumber++}`;
    return `
      <div class="pg horizontal-page">
        <div class="horizontal-title">Momentos juntos ❤️</div>
        <div class="horizontal-photos">${slot(a, 'horizontal')}${slot(b, 'horizontal')}</div>
        <span class="n">${n}</span>
      </div>`;
  }
  const a = `foto-${nextSlotNumber++}`;
  return `
    <div class="pg vertical-page">
      <div class="vertical-title">Un momento especial ❤️</div>
      <div class="vertical-photo">${slot(a, 'vertical')}</div>
      <span class="n">${n}</span>
    </div>`;
}

/* PORTADA */
const cover = `
  <div class="cover">
    <i></i>
    <h1 contenteditable spellcheck="false">Nuestro álbum</h1>
    <div class="s" contenteditable spellcheck="false">Para ti, con todo mi cariño</div>
    <i></i>
  </div>`;

/* HOJA (portada/frente + dorso)
   Orden de lectura: dorso de la portada = página 1,
   frente de la hoja 1 = página 2, dorso = página 3... */
function addLeaf(){
  const i = leaves.length;
  const l = document.createElement('div');
  l.className = 'leaf';
  l.innerHTML = `
    <div class="face front">${i ? page(2 * i) : cover}</div>
    <div class="face back">${page(2 * i + 1)}</div>`;

  l.querySelectorAll('.ph').forEach(ph => {
    const open = () => { target = ph; file.value = ''; file.click(); };
    ph.addEventListener('click', open);
    ph.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }
    });
  });

  wrap.appendChild(l);
  leaves.push(l);
  render(true);
}

/* RENDER */
function render(now){
  const L = leaves.length;
  leaves.forEach((l, i) => {
    l.classList.toggle('flip', i < p);
    const z = i < p ? i : L - i;
    if(now) l.style.zIndex = z;
    else setTimeout(() => { l.style.zIndex = z; }, 400);
  });
  wrap.style.transform = p === 0 ? 'translateX(-25%)' : p === L ? 'translateX(25%)' : 'none';
  prev.disabled = p === 0;
  next.disabled = p === L;
}

/* NAVEGACIÓN */
function go(d){
  const n = Math.max(0, Math.min(leaves.length, p + d));
  if(n !== p){ p = n; render(false); }
}
prev.onclick = () => go(-1);
next.onclick = () => go(1);
add.onclick = () => { addLeaf(); p = leaves.length - 1; render(false); };

document.addEventListener('keydown', e => {
  if(e.target.isContentEditable) return;
  if(e.key === 'ArrowRight') go(1);
  if(e.key === 'ArrowLeft') go(-1);
});

let x0 = null;
document.addEventListener('pointerdown', e => { x0 = e.clientX; });
document.addEventListener('pointerup', e => {
  if(x0 === null) return;
  const d = e.clientX - x0;
  x0 = null;
  if(Math.abs(d) > 70) go(d < 0 ? 1 : -1);
});

/* SUBIR FOTO */
async function uploadPhoto(f, photoSlot){
  if(!f) return;
  if(!photoSlot){ showStatus('No se encontró el espacio de la foto.', true); return; }
  if(!['image/jpeg', 'image/png', 'image/webp'].includes(f.type)){ showStatus('Usa JPG, PNG o WebP.', true); return; }
  if(f.size > 10 * 1024 * 1024){ showStatus('La foto no puede superar los 10 MB.', true); return; }

  photoSlot.classList.add('uploading');
  showStatus('Subiendo foto ❤️');

  try{
    const formData = new FormData();
    formData.append('slot', photoSlot.dataset.slot);
    formData.append('foto', f);

    const response = await fetch(`${API_BASE}/api/upload`, {
      method: 'POST',
      headers: { 'x-album-key': ALBUM_KEY },
      body: formData
    });
    const data = await response.json();

    if(!response.ok || !data.success){
      throw new Error(data.message || data.error || 'No se pudo subir la foto.');
    }

    const foto = data.foto;
    mostrarFoto(photoSlot, foto.url, foto.orientacion, foto.width, foto.height);
    showStatus('Foto guardada ❤️');
  }catch(error){
    console.error(error);
    showStatus('No se pudo subir la foto: ' + error.message, true);
  }finally{
    photoSlot.classList.remove('uploading');
    file.value = '';
  }
}

/* MOSTRAR FOTO */
function mostrarFoto(photoSlot, url, orientation, width, height){
  photoSlot.innerHTML = '';
  photoSlot.classList.remove('horizontal', 'vertical', 'empty');

  let o = orientation;
  if(!o && width && height) o = width >= height ? 'horizontal' : 'vertical';
  photoSlot.classList.add(o === 'vertical' ? 'vertical' : 'horizontal');

  const img = document.createElement('img');
  img.src = url;
  img.alt = 'Foto del álbum ❤️';
  img.loading = 'lazy';
  photoSlot.appendChild(img);
}

file.onchange = async () => {
  const f = file.files[0];
  if(!f || !target){ file.value = ''; return; }
  await uploadPhoto(f, target);
};

/* CARGAR ÁLBUM
   Antes de colocar las fotos se crean todas las hojas necesarias,
   para que las fotos de hojas agregadas no se pierdan al recargar. */
async function loadAlbum(){
  try{
    showStatus('Cargando nuestro álbum…');

    const response = await fetch(`${API_BASE}/api/album`);
    if(!response.ok) throw new Error('No se pudo consultar el álbum.');

    const data = await response.json();
    if(!data || !data.fotos) return;

    const ids = Object.keys(data.fotos).map(id => {
      const m = id.match(/^foto-(\d+)$/);
      return m ? Number(m[1]) : 0;
    });
    const maxId = Math.max(0, ...ids);

    while(nextSlotNumber - 1 < maxId) addLeaf();

    Object.entries(data.fotos).forEach(([slotId, foto]) => {
      const ph = document.querySelector(`.ph[data-slot="${slotId}"]`);
      if(ph) mostrarFoto(ph, foto.url, foto.orientacion, foto.width, foto.height);
    });

    showStatus('Álbum cargado ❤️');
  }catch(error){
    console.error(error);
    showStatus('No se pudo conectar con el álbum.', true);
  }
}

/* INICIO: 4 hojas y carga de fotos */
for(let i = 0; i < 4; i++) addLeaf();
loadAlbum();
</script>
</body>
</html>
